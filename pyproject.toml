[project]
name = "master-thesis-vt26"
version = "0.1.0"
description = "DINO-style self-supervised pretraining of graph neural network (GAT/GINE) molecular encoders on ZINC, evaluated via frozen-embedding probes and finetuning on MoleculeNet and TDC ADMET benchmarks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chemprop>=2.2.2",
    "deepchem>=2.8.0",
    "hyperopt>=0.3.0",
    "json5>=0.12.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pytdc>=0.3.6",
    "rdkit>=2025.9.4",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
]
